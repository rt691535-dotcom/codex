<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的音乐空间</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 {
            margin-bottom: 30px;
            color: #a78bfa;
            text-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
        }
        .playlist {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        .song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            border-radius: 10px;
            margin-bottom: 5px;
        }
        .song-item:hover {
            background: rgba(167, 139, 250, 0.2);
            transform: translateX(5px);
        }
        .song-item.active {
            background: rgba(167, 139, 250, 0.3);
            border-left: 4px solid #a78bfa;
        }
        .song-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .cover {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            background: #333;
        }
        .title {
            font-weight: bold;
            font-size: 16px;
        }
        .artist {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }
        .play-btn {
            background: #a78bfa;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            transition: transform 0.2s, background 0.3s;
        }
        .play-btn:hover {
            background: #8b5cf6;
            transform: scale(1.1);
        }
        /* 底部播放控制条 */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(15px);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        #now-playing {
            font-size: 14px;
            color: #a78bfa;
            margin-right: 20px;
        }
        audio {
            width: 100%;
            max-width: 400px;
            height: 40px;
            outline: none;
        }
    </style>
</head>
<body>

    <h1>🎧 我的音乐空间</h1>

    <div class="playlist" id="playlist">
        <!-- 歌曲列表会通过 JS 动态生成 -->
    </div>

    <!-- 底部固定播放器 -->
    <div class="player-bar">
        <span id="now-playing">未播放</span>
        <audio id="audio-player" controls>
            你的浏览器不支持 audio 标签。
        </audio>
    </div>

    <script>
        // --- 1. 你的音乐数据（在这里修改！） ---
        const songs = [
            {
                title: "第一首歌",
                artist: "歌手A",
                cover: "cover1.jpg", // 如果没有封面图，可以留空，或放一张占位图
                src: "song1.mp3"    // 确保这个文件在同一个文件夹里
            },
            {
                title: "第二首歌",
                artist: "歌手B",
                cover: "cover2.jpg",
                src: "song2.mp3"
            },
            {
                title: "第三首歌",
                artist: "歌手C",
                cover: "cover3.jpg",
                src: "song3.mp3"
            }
        ];

        const playlistEl = document.getElementById('playlist');
        const audioPlayer = document.getElementById('audio-player');
        const nowPlayingEl = document.getElementById('now-playing');

        let currentSongIndex = -1;

        // --- 2. 渲染歌曲列表 ---
        function renderPlaylist() {
            playlistEl.innerHTML = '';
            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'song-item';
                item.dataset.index = index;

                // 如果没有封面图，用一张灰色的占位图
                const coverUrl = song.cover || 'https://via.placeholder.com/50/333/aaa?text=♪';

                item.innerHTML = `
                    <div class="song-info">
                        <img class="cover" src="${coverUrl}" alt="封面" onerror="this.src='https://via.placeholder.com/50/333/aaa?text=♪'">
                        <div>
                            <div class="title">${song.title}</div>
                            <div class="artist">${song.artist}</div>
                        </div>
                    </div>
                    <button class="play-btn">▶</button>
                `;

                // 点击整个条目或者按钮都可以播放
                item.addEventListener('click', () => playSong(index));
                playlistEl.appendChild(item);
            });
        }

        // --- 3. 播放歌曲的核心逻辑 ---
        function playSong(index) {
            // 如果点击的是当前正在播放的歌曲，则暂停/播放切换
            if (currentSongIndex === index) {
                if (audioPlayer.paused) {
                    audioPlayer.play();
                } else {
                    audioPlayer.pause();
                }
                updatePlayButtonState(index);
                return;
            }

            // 播放新歌曲
            currentSongIndex = index;
            const song = songs[index];
            audioPlayer.src = song.src;
            audioPlayer.play().catch(e => {
                console.error("播放失败，请检查音乐文件路径：", e);
                alert("播放失败！请确认音乐文件（如 song1.mp3）和网页在同一个文件夹里，且名字完全一致。");
            });

            nowPlayingEl.textContent = `正在播放：${song.title} - ${song.artist}`;
            
            // 更新列表中的高亮状态
            document.querySelectorAll('.song-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
                const btn = el.querySelector('.play-btn');
                if (i === index) {
                    btn.textContent = '⏸';
                } else {
                    btn.textContent = '▶';
                }
            });
        }

        // --- 4. 监听音频自身播放状态变化（比如播放结束） ---
        audioPlayer.addEventListener('play', () => {
            if (currentSongIndex !== -1) {
                const btn = document.querySelector(`.song-item[data-index="${currentSongIndex}"] .play-btn`);
                if (btn) btn.textContent = '⏸';
            }
        });

        audioPlayer.addEventListener('pause', () => {
            if (currentSongIndex !== -1) {
                const btn = document.querySelector(`.song-item[data-index="${currentSongIndex}"] .play-btn`);
                if (btn) btn.textContent = '▶';
            }
        });

        // 播放结束后自动播放下一首
        audioPlayer.addEventListener('ended', () => {
            let nextIndex = (currentSongIndex + 1) % songs.length;
            playSong(nextIndex);
        });

        // 初始化
        renderPlaylist();
    </script>
</body>
</html>
